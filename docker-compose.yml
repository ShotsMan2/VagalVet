version: '3.8'

services:
  app:
    build: .
    container_name: vagalvet_app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=supersecretjwtkey # Override in production
      - JWT_REFRESH_SECRET=supersecretrefreshkey # Override in production
    volumes:
      # Optional: Mount database file to persist data
      # - vagalvet_data:/app/server
      - /app/node_modules

# volumes:
#   vagalvet_data:
